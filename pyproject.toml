[project]
name = "fifa-win-probability-research"
version = "0.1.0"
description = "Research environment for FIFA World Cup match win probability modeling."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "duckdb>=1.0.0,<2.0.0",
    "jupyterlab>=4.2.0,<5.0.0",
    "lxml>=5.2.0,<6.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "numpy>=2.0.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "plotly>=5.22.0,<6.0.0",
    "pyarrow>=17.0.0,<18.0.0",
    "pytest>=8.2.0,<9.0.0",
    "requests>=2.32.0,<3.0.0",
    "ruff>=0.5.0,<0.6.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "scipy>=1.13.0,<2.0.0",
    "seaborn>=0.13.0,<0.14.0",
    "statsmodels>=0.14.0,<0.15.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

